# The chart adapter on Gemma 4 12B: the chat seat, which the demo also runs every sub-agent on.
#
# The same recipe as the E4B configs with the rank doubled, which is what the user settled on
# 2026-09-06. The research note's own table suggests 1e-4 at this size rather than 2e-4; the
# decision was to keep one learning rate across the four adapters so the learning curves are
# comparable, and to revisit it if the 12B curve is noisier than the E4B one.
name: chart-12b
adapter: chart
base: /sc/scratch/rahul.singh/finquery-hf/gemma-4-12b-it
samples: /sc/scratch/rahul.singh/finquery-training/data/chart.jsonl
output: /sc/scratch/rahul.singh/finquery-training/runs/chart-12b

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

train:
  epochs: 3
  lr: 2e-4
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  seq_len: 4096
  per_device_batch: 1
  grad_accum: 16
  seed: 7
