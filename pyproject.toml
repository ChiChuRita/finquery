[project]
name = "finquery"
version = "0.1.0"
description = "Local-first conversational personal-finance analyst"
authors = [
    { name = "Rahul Singh", email = "43885405+ChiChuRita@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "llama-cpp-python>=0.3.35",
    "pydantic-ai-slim[openrouter,ui]>=2.39.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "quickjs>=1.19.4",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
finquery = "finquery.main:main"
finquery-check = "finquery.local.check:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
