<!-- @dsCard group="Colors" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>
body{padding:24px} .row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px} .sw{height:56px;border-radius:var(--radius-md);border:1px solid var(--border)} .l{font-size:12px;color:var(--muted-foreground);margin-top:6px} h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-foreground)}
</style></head><body>
<h4>Surfaces and text</h4>
<div class="row">
<div><div class="sw" style="background:var(--background)"></div><div class="l">background</div></div>
<div><div class="sw" style="background:var(--card)"></div><div class="l">card</div></div>
<div><div class="sw" style="background:var(--muted)"></div><div class="l">muted</div></div>
<div><div class="sw" style="background:var(--foreground)"></div><div class="l">foreground</div></div>
<div><div class="sw" style="background:var(--muted-foreground)"></div><div class="l">muted foreground</div></div>
<div><div class="sw" style="background:var(--sidebar-accent)"></div><div class="l">active row tint</div></div>
</div>
<h4>Accent and semantics</h4>
<div class="row">
<div><div class="sw" style="background:var(--primary)"></div><div class="l">primary (green)</div></div>
<div><div class="sw" style="background:var(--warning)"></div><div class="l">warning</div></div>
<div><div class="sw" style="background:var(--destructive)"></div><div class="l">destructive</div></div>
<div><div class="sw" style="background:var(--border)"></div><div class="l">border, hairline</div></div>
</div>
<h4>Chart palette, in order</h4>
<div class="row">
<div><div class="sw" style="background:var(--chart-1)"></div><div class="l">chart 1</div></div>
<div><div class="sw" style="background:var(--chart-2)"></div><div class="l">chart 2</div></div>
<div><div class="sw" style="background:var(--chart-3)"></div><div class="l">chart 3</div></div>
<div><div class="sw" style="background:var(--chart-4)"></div><div class="l">chart 4</div></div>
<div><div class="sw" style="background:var(--chart-5)"></div><div class="l">chart 5</div></div>
<div><div class="sw" style="background:var(--chart-6)"></div><div class="l">chart 6</div></div>
</div>
</body></html>
