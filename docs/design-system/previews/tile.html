body{padding:24px} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:560px}
.tile{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:4px}

.d{font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted-foreground)} .up{color:var(--primary)} .down{color:var(--destructive)}
</style></head><body>
<div class="grid">
<div class="tile"><div class="lab">Spent</div><div class="val">2.346,34 €</div><div class="per">December 2025</div><div class="d up">-73,80 € (-3 %) vs last month</div><div class="d up">-72,69 € (-3 %) vs 6-month average</div></div>
<div class="tile"><div class="lab">Net</div><div class="val">503,66 €</div><div class="per">December 2025</div><div class="d up">+73,80 € (+17,2 %) vs last month</div><div class="d up">+72,69 € (+16,9 %) vs 6-month average</div></div>
</div>
</body></html>
