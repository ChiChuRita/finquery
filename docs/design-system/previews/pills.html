<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>
body{padding:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{font-size:12px;border:1px solid var(--border);border-radius:6px;padding:2px 8px;color:var(--muted-foreground)}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px} .ok{background:color-mix(in oklch,var(--primary) 16%,transparent);color:var(--primary)} .warn{background:color-mix(in oklch,var(--warning) 16%,transparent);color:var(--warning)} .bad{background:color-mix(in oklch,var(--destructive) 16%,transparent);color:var(--destructive)}
.btn{font-size:13px;padding:7px 12px;border-radius:var(--radius-md);border:1px solid var(--border)} .btn.p{background:var(--primary);color:var(--primary-foreground);border-color:transparent;font-weight:600} .chip{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:4px 10px}
</style></head><body>
<span class="pill">Line</span><span class="pill">On the dashboard</span>
<span class="badge ok">done</span><span class="badge warn">in progress</span><span class="badge bad">not claimed</span>
<span class="btn p">Apply</span><span class="btn">Discard</span><span class="btn">Undo</span>
<span class="chip">What can you help me with?</span>
</body></html>
