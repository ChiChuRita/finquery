<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css"><style>
body{padding:0} .sb{width:256px;height:420px;border-right:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:8px;height:32px;font-weight:600;font-size:14px} .mark{width:32px;height:32px;border-radius:8px;background:var(--primary);display:inline-block}
.new{height:32px;border:1px solid var(--border);border-radius:var(--radius-md);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;margin:6px 0 12px} .new span{color:var(--primary)}
.row{height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:var(--radius-md);font-size:14px;color:var(--muted-foreground)} .row.on{background:var(--sidebar-accent);color:var(--foreground)} .ic{width:16px;height:16px;border:1.5px solid currentColor;border-radius:3px;display:inline-block}
.lab{font-size:12px;color:var(--muted-foreground);margin:12px 0 4px}
</style></head><body>
<div class="sb">
<div class="brand"><span class="mark"></span>FinQuery</div>
<div class="new"><span>+</span> New chat</div>
<div class="row on"><span class="ic"></span>Dashboard</div>
<div class="row"><span class="ic"></span>Transactions</div>
<div class="row"><span class="ic"></span>Imports</div>
<div class="row"><span class="ic"></span>Memory</div>
<div class="lab">Recent</div>
<div class="row"><span class="ic"></span>The sample year</div>
</div>
</body></html>
